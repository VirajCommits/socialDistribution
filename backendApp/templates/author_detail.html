<!DOCTYPE html>
<html>
<head>
    <title>{{ author.displayName }}'s Profile</title>
</head>
<body>
    <h2>Welcome, {{ author.displayName }}</h2>
    <p><strong>Host:</strong> {{ author.host }}</p>
    <p><strong>GitHub:</strong> <a href="{{ author.github }}">{{ author.github }}</a></p>
    <p><strong>Profile Image:</strong></p>
    {% if author.profileImage %}
        <img src="{{ author.profileImage }}" alt="Profile Image" width="200"/>
    {% else %}
        <p>No profile image.</p>
    {% endif %}
    <p><a href="{% url 'logout' %}">Logout</a></p>
</body>
</html>
